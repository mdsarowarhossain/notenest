name: notenest
description: NoteNest — personal academic workspace for students.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  path: ^1.9.1
  sqflite: ^2.4.3
  sqflite_common_ffi_web: ^1.1.2

  # Optional, for the intended typefaces. After adding it, open
  # lib/theme/nest_theme.dart and set the NestFont values.
  # google_fonts: ^6.2.1

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
